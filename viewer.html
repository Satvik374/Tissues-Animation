<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tissue Viewer — Tissues 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧫</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="viewer">
    <div id="stage"></div>
    <div class="labels-layer" id="labels"></div>

    <div class="loading" id="loading">
      <div class="loader-ring"></div>
      <div class="ltext">Building 3D model…</div>
    </div>

    <div class="topbar">
      <a class="back" href="index.html">← All tissues</a>
      <div class="title-block">
        <span class="t" id="v-title">Tissue</span>
        <span class="s" id="v-sub"></span>
      </div>
      <div class="spacer"></div>
      <div class="pill-nav" id="tab-nav">
        <button data-tab="info" class="active">Info</button>
        <button data-tab="labels">Labels</button>
      </div>
    </div>

    <aside class="infopanel" id="infopanel">
      <div class="head">
        <div class="eyebrow" id="ip-eyebrow">Plant tissue</div>
        <h2 id="ip-title">—</h2>
      </div>
      <div class="body">
        <p id="ip-desc"></p>
        <ul class="facts" id="ip-facts"></ul>
      </div>
      <div class="step-box">
        <div class="lbl">Now animating</div>
        <div class="step-title" id="ip-step-title">—</div>
        <div class="step-text" id="ip-step-text"></div>
      </div>
    </aside>

    <div class="hint">Drag to rotate · scroll to zoom · right-drag to pan</div>

    <div class="controls">
      <div class="progress"><div class="fill" id="prog"></div></div>
      <button class="primary" id="btn-play">⏸ Pause</button>
      <button id="btn-restart">↺ Restart</button>
      <div class="sep"></div>
      <button id="btn-rotate">🔄 Auto-rotate: On</button>
      <button id="btn-labels">🏷 Labels: On</button>
      <div class="sep"></div>
      <div class="speed">Speed
        <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1">
        <span id="speed-val">1×</span>
      </div>
    </div>

    <div class="module-jump">
      <select id="jump" aria-label="Jump to another tissue"></select>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three/three.module.js",
      "three/addons/": "./js/vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
